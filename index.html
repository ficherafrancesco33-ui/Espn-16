<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ea580c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ESPN 16</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700;800&display=swap">
<style>
/* ===== ESPN 16 – app del Fantabasket Dynasty a 16 squadre (base grafica: app Dreamers) =====
   Colori in variabili: tema arancio come la Home Dreamers. */
:root{--c2:#fdf3e1;--c3:#fff7ed;--cb:#f3c48d;--c4:#fbe9cc;--hd1:#f97316;--hd2:#ea580c;--hd3:#c2410c;--bg1:#b8763f;--bg2:#a8652f;--card:var(--c2);--card2:var(--c4);--line:#eed2a6;--ink:#3b1d0a;--mut:#9a5a2b;--acc:#ea580c;--ffp:#7c3aed;--win:#16a34a;--loss:#dc2626;--east:#2563eb;--west:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Barlow,system-ui,sans-serif;color:var(--ink);min-height:100vh;
 background:repeating-linear-gradient(90deg,var(--bg1) 0 46px,var(--bg2) 46px 92px);}
.bc{font-family:'Barlow Condensed',system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:linear-gradient(180deg,var(--hd1),var(--hd2));border-bottom:4px solid var(--hd3);box-shadow:0 6px 18px rgba(0,0,0,.25);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0}
.top{display:flex;align-items:center;gap:12px}
.applg{width:46px;height:46px;border-radius:13px;background:linear-gradient(160deg,#fb923c,#c2410c);display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
.applg b{font:800 italic 17px 'Barlow Condensed';color:#fff;letter-spacing:.5px}
.appn{font:800 italic 30px/1 'Barlow Condensed';color:#fff;letter-spacing:.5px;text-shadow:0 2px 0 rgba(0,0,0,.15)}
.upd{margin-left:auto;font:600 11px Barlow;color:#ffedd5;text-align:right}
nav{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;background:rgba(255,255,255,.08);color:#fff;font:800 italic 17px 'Barlow Condensed';letter-spacing:.6px;padding:10px 14px 9px;border-radius:8px 8px 0 0;cursor:pointer}
nav button.on{background:var(--hd3)}
main{padding:14px 12px 40px;max-width:900px;margin:0 auto}
.card{background:var(--card);border-radius:18px;box-shadow:0 4px 0 rgba(0,0,0,.12),0 8px 20px rgba(0,0,0,.12)}
/* HOME: 8 squadre East a sinistra, 8 West a destra, finestra della notte al centro (più stretta che in Dreamers) */
.hgrid{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:8px;align-items:start}
.hcol{display:flex;flex-direction:column;gap:7px}
.hconf{font:800 italic 12px 'Barlow Condensed';color:#fff;text-align:center;letter-spacing:1px;padding:3px 0;border-radius:6px}
.hconf.e{background:var(--east)}.hconf.w{background:var(--west)}
.tile{display:block;width:56px;height:56px;border-radius:14px;border:0;padding:3px;cursor:pointer;background:linear-gradient(160deg,var(--c3),#fed7aa);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.tile img{width:100%;height:100%;border-radius:50%;display:block}
.night{padding:12px 10px 6px}
.nhd{display:flex;align-items:center;justify-content:space-between;font:800 italic 18px 'Barlow Condensed';color:var(--acc);letter-spacing:1.5px}
.nhd button{border:0;background:none;font:800 22px 'Barlow Condensed';color:var(--acc);padding:2px 8px;cursor:pointer}
.nsub{display:flex;justify-content:space-between;font:800 italic 12.5px 'Barlow Condensed';color:var(--mut);letter-spacing:.8px;border-bottom:2px solid var(--line);padding:8px 2px 6px;margin-bottom:4px}
.pr{padding:9px 2px;border-bottom:1px solid var(--line)}
.prn{display:flex;align-items:center;gap:7px}
.prn b{font:600 17px Barlow;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fb{flex:none;font:800 italic 14px 'Barlow Condensed';color:#fff;background:var(--ffp);border-radius:7px;padding:2px 7px}
.prs{font:500 13px Barlow;color:var(--mut);margin:2px 0 6px}
.bx{display:flex;flex-wrap:wrap;gap:4px}
.bx span{min-width:34px;text-align:center;border:1.5px solid var(--cb);border-radius:8px;background:var(--c3);padding:2px 3px 1px;font:800 16px/1 'Barlow Condensed'}
.bx span i{display:block;font:700 9px 'Barlow Condensed';color:var(--mut);font-style:normal;margin-top:2px}
.bx span.g{color:var(--win)}.bx span.r{color:var(--loss)}
.empty{padding:22px 8px;text-align:center;color:var(--mut);font:600 14px Barlow}
.srch{display:flex;align-items:center;gap:8px;background:var(--c2);border:2px solid var(--cb);border-radius:30px;padding:9px 14px;margin-bottom:12px}
.srch input{border:0;background:none;font:500 17px Barlow;color:var(--ink);outline:none;width:100%}
/* LEGA */
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;border:0;border-radius:10px;padding:9px 4px;font:800 italic 16px 'Barlow Condensed';letter-spacing:.6px;background:var(--c2);color:var(--mut);cursor:pointer}
.seg button.on{background:var(--acc);color:#fff}
.ttl{font:800 italic 20px 'Barlow Condensed';letter-spacing:1px;padding:12px 14px 6px;display:flex;align-items:center;gap:8px}
.ttl .dot{width:10px;height:10px;border-radius:50%}
table{width:100%;border-collapse:collapse}
th{font:800 11.5px 'Barlow Condensed';color:var(--mut);letter-spacing:.6px;text-align:right;padding:6px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{font:600 14px Barlow;padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.tm{display:flex;align-items:center;gap:8px;min-width:0}
.tm img{width:30px;height:30px;border-radius:50%;flex:none}
.tm span{overflow:hidden;text-overflow:ellipsis}
.tm small{display:block;font:500 11.5px Barlow;color:var(--mut)}
.po td{background:rgba(22,163,74,.07)}.po2 td{background:rgba(234,88,12,.06)}
.note{font:500 12.5px Barlow;color:var(--mut);padding:8px 14px 12px}
.mt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.mt .tm:last-child{flex-direction:row-reverse;text-align:right}
.mt .vs{font:800 italic 14px 'Barlow Condensed';color:var(--mut)}
.br{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 12px 14px}
.brm{border:2px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--c3)}
.brm div{display:flex;align-items:center;gap:6px;font:700 13px Barlow;padding:3px 0}
.brm img{width:22px;height:22px;border-radius:50%}
.brm em{font:800 italic 12px 'Barlow Condensed';color:var(--mut);font-style:normal;width:16px}
/* STATISTICHE */
.flt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.flt select{border:2px solid var(--cb);border-radius:10px;background:var(--c2);font:700 14px Barlow;color:var(--ink);padding:7px 8px}
.tw{overflow-x:auto}
.tw th{cursor:pointer;position:sticky;top:0;background:var(--card)}
.tw th.on{color:var(--acc)}
.tw td.f{font:800 italic 16px 'Barlow Condensed';color:var(--ffp)}
.pl{font:600 14px Barlow;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.pl small{display:block;font:500 11px Barlow;color:var(--mut)}
.rules{padding:4px 14px 12px;font:500 13px Barlow;color:var(--mut)}
.rules b{color:var(--ink)}
/* statistiche (stats.js) */
.hub{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.hubb{display:flex;align-items:center;gap:14px;border:0;border-radius:18px;padding:16px 18px;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.hubb span{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:20px}
.hubb b{font:800 italic 28px 'Barlow Condensed';letter-spacing:1px;flex:1;text-align:left}
.hubb i{font:800 22px Barlow;font-style:normal;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center}
.hubb.b1{background:linear-gradient(90deg,#1e2a5a,#2b3d84)}.hubb.b2{background:linear-gradient(90deg,#ea580c,#f97316)}.hubb.b3{background:linear-gradient(90deg,#166534,#16a34a)}
.bk,.bk2{border:0;background:none;font:800 italic 16px 'Barlow Condensed';color:#fff;letter-spacing:1px;padding:4px 0 10px;cursor:pointer}
.bk2{border:2px solid #fff;border-radius:20px;padding:6px 14px;margin-bottom:12px}
.sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}.sh span{background:var(--acc);color:#fff;font:800 italic 22px 'Barlow Condensed';padding:4px 14px;transform:skew(-8deg)}.sh em{font:800 italic 14px 'Barlow Condensed';color:#fff;letter-spacing:1px}
.srch2{display:flex;gap:8px;align-items:center;background:var(--c2);border-radius:14px;padding:10px 14px;margin-bottom:8px}.srch2 input{border:0;background:none;font:500 16px Barlow;width:100%;outline:none;color:var(--ink)}
.slab{font:800 12px 'Barlow Condensed';color:#fff;letter-spacing:1.2px;margin:8px 0 4px}.cmpc .slab{color:var(--mut)}
.per label{display:flex;align-items:center;gap:6px;background:var(--c2);border-radius:14px;padding:8px 12px;font:800 italic 15px 'Barlow Condensed';color:var(--acc)}
.per input{border:0;background:none;font:800 italic 15px 'Barlow Condensed';color:var(--acc);min-width:0;flex:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:2px solid var(--cb);background:var(--c2);border-radius:8px;font:800 italic 13px 'Barlow Condensed';letter-spacing:.8px;color:var(--acc);padding:6px 10px;cursor:pointer}.chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.tg{display:flex;gap:4px;margin:4px 0 8px}.tg button{border:0;background:var(--c2);color:var(--acc);font:800 italic 13px 'Barlow Condensed';padding:6px 14px;transform:skew(-10deg);cursor:pointer}.tg button.on{background:var(--acc);color:#fff}
.gt{overflow-x:auto;background:var(--card);border-radius:16px}
.gt th{background:var(--acc);color:#fff;font:800 italic 12px 'Barlow Condensed';padding:9px 6px;text-align:right;cursor:pointer}.gt th.on{color:#fde68a}
.gt td{padding:9px 6px;font:700 15px 'Barlow Condensed'}.gt td.rn{color:var(--acc);font:800 italic 16px 'Barlow Condensed'}
.gt tr[data-pl]{cursor:pointer}
.gn b{display:flex;align-items:center;gap:6px;font:800 italic 17px 'Barlow Condensed';color:var(--acc);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.gn small{display:flex;align-items:center;gap:4px;font:600 11.5px Barlow;color:var(--mut);white-space:nowrap}.gn small img{width:16px;height:16px;border-radius:50%}
.rb{display:inline-block;width:4px;height:15px;border-radius:2px;transform:skew(-12deg);background:#9ca3af}.rb.G{background:#f87171}.rb.A{background:#fbbf24}.rb.C{background:#60a5fa}
.ffb{display:inline-block;min-width:46px;text-align:center;border-radius:8px;color:#fff;font:800 italic 15px/1 'Barlow Condensed';padding:5px 6px}
.ffb.v,.cl.v,.lg.v{background:#7c3aed}.ffb.g,.cl.g,.lg.g{background:#16a34a}.ffb.o,.cl.o,.lg.o{background:#ea8a0c}.ffb.r,.cl.r,.lg.r{background:#dc2626}
.ef{white-space:nowrap}.dt{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.dt.g{background:#16a34a}.dt.o{background:#ea8a0c}.dt.r{background:#dc2626}
.bxm{display:flex;gap:3px;margin-top:4px}.bxm span{min-width:30px;text-align:center;border:1.5px solid var(--cb);border-radius:6px;background:var(--c3);font:800 12px/1 'Barlow Condensed';padding:2px}.bxm i{display:block;font:700 7.5px 'Barlow Condensed';color:var(--mut);font-style:normal}
.tchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}.tchips::-webkit-scrollbar{display:none}
.tchips button{flex:none;display:flex;align-items:center;gap:6px;border:2px solid var(--cb);background:var(--c2);border-radius:10px;padding:5px 10px 5px 5px;font:800 italic 14px 'Barlow Condensed';color:var(--acc);cursor:pointer}.tchips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}.tchips img{width:28px;height:28px;border-radius:50%}
.tban{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#1e2a5a,#2b4aa8);border-radius:16px;padding:16px;color:#fff;margin-bottom:10px}.tban img{width:70px;height:70px;border-radius:50%}.tban small{font:800 11px 'Barlow Condensed';letter-spacing:1.5px;opacity:.85}.tban b{display:block;font:800 italic 30px/1 'Barlow Condensed'}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--cb);border-radius:14px;overflow:hidden;margin-bottom:8px}.kp.k3{grid-template-columns:1fr 1fr 1fr}
.kp div{background:var(--card);padding:10px 12px}.kp small{font:800 11px 'Barlow Condensed';color:var(--mut);letter-spacing:1px}.kp b{display:block;font:800 italic 28px/1.1 'Barlow Condensed';color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kp span{font:500 11.5px Barlow;color:var(--mut)}
.cmpb{width:100%;border:2px solid var(--cb);background:var(--c3);border-radius:12px;padding:11px;font:800 italic 16px 'Barlow Condensed';letter-spacing:1px;color:var(--acc);margin:6px 0 10px;cursor:pointer}
.mt2{overflow-x:auto;background:var(--card);border-radius:16px}.mt2 th{background:var(--acc);color:#fff;font:800 italic 12px 'Barlow Condensed';padding:8px 5px;text-align:center}.mt2 th:first-child{text-align:left}
.mt2 td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}.mt2 td:first-child{text-align:left;cursor:pointer;min-width:140px}
.cl{display:inline-block;min-width:40px;border-radius:8px;color:#fff;font:800 italic 14px/1 'Barlow Condensed';padding:5px 3px 2px}.cl i{display:block;font:700 8px 'Barlow Condensed';font-style:normal;opacity:.9;margin-top:2px}
.lg{display:inline-block;color:#fff;font:800 italic 11px 'Barlow Condensed';padding:2px 6px;border-radius:6px}
.pbg{background:linear-gradient(180deg,#1e3a8a,#1e40af);border-radius:18px;padding:14px;margin:-4px -2px 0}
.ph{display:flex;align-items:center;gap:12px;color:#fff;margin-bottom:6px}.ph img{width:62px;height:62px;border-radius:50%}.ph small{font:800 11px 'Barlow Condensed';letter-spacing:1.5px;opacity:.85}.ph b{display:block;font:800 italic 28px/1 'Barlow Condensed'}
.psel{width:100%;border:2px solid #fff;border-radius:12px;background:#1e3a8a;color:#fde68a;font:800 italic 16px 'Barlow Condensed';padding:9px}
.mp{display:flex;background:rgba(255,255,255,.12);border-radius:12px;padding:3px;gap:3px}.mp button{flex:1;border:0;background:none;color:#fff;font:800 italic 15px 'Barlow Condensed';letter-spacing:1px;padding:8px;border-radius:9px;cursor:pointer}.mp button.on{background:#0b1022}
.mp.lt{background:var(--c2)}.mp.lt button{color:var(--mut)}.mp.lt button.on{background:var(--acc);color:#fff}
.mt3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}.mt3 button{border:0;border-radius:12px;background:#93a8e6;color:#1e2a5a;padding:8px 4px;cursor:pointer}.mt3 button.on{background:var(--acc);color:#fff}.mt3 small{font:800 11px 'Barlow Condensed';letter-spacing:1px}.mt3 b{display:block;font:800 italic 22px 'Barlow Condensed'}
.chw{background:#0b1022;border-radius:16px;padding:10px 8px 8px;margin-top:6px}.chh{display:flex;justify-content:flex-end;gap:14px;font:800 14px 'Barlow Condensed';color:#e5e7eb;padding:0 6px}.chh .up{color:#4ade80}.chh .dn{color:#f87171}
.chs{width:100%;height:auto;display:block}.chn{font:500 12px Barlow;color:#9aa3c4;padding:2px 6px}
.glog td,.glog th{text-align:center!important;font-size:13.5px}
.cmpc{padding:14px}.cmpc h3{margin:2px 0 10px;font:800 italic 28px 'Barlow Condensed';color:var(--acc)}.up2{font:800 11px 'Barlow Condensed';color:var(--mut);letter-spacing:1.2px}
.csel{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--cb);border-radius:14px;padding:4px 10px;margin-bottom:8px}.csel i{width:10px;height:10px;border-radius:50%;flex:none}.csel select{border:0;background:none;font:800 italic 15px 'Barlow Condensed';color:var(--acc);width:100%;padding:6px 0}
.cmpe{background:#fff;border-radius:14px;padding:30px 10px;text-align:center;color:var(--acc);font:500 15px Barlow;margin-top:10px}
/* salary cap e scelte */
.capbox{margin:0 12px 10px;padding:12px;border-radius:14px;background:var(--c3);border:2px solid var(--line)}
.capn{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.capn b{display:block;font:800 italic 26px/1 'Barlow Condensed'}
.capn div:first-child b{color:var(--win)}
.capn span{font:800 11px 'Barlow Condensed';color:var(--mut);letter-spacing:.8px}
.capbar{display:flex;height:12px;border-radius:7px;overflow:hidden;margin:10px 0 6px;background:#eee}
.capleg{display:flex;gap:12px;justify-content:center;font:600 11.5px Barlow;color:var(--mut)}
.capleg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.ct td,.ct th{padding:7px 5px}
.ct td.e{color:var(--mut)}
.ct tr.tot td{font:800 13px 'Barlow Condensed';background:var(--c4);letter-spacing:.3px}
.ct tr[data-team]{cursor:pointer}
.rk{display:inline-block;font:800 10px/1 'Barlow Condensed';color:#fff;background:var(--ffp);border-radius:4px;padding:2px 4px;vertical-align:2px}
.pky{margin:0 12px 10px;border:2px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--c3)}
.pkyh{display:flex;justify-content:space-between;font:800 italic 17px 'Barlow Condensed';color:var(--acc);letter-spacing:1px;margin-bottom:4px}
.pkyh span{font:700 12px Barlow;color:var(--mut);letter-spacing:0;font-style:normal}
.pk{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px solid var(--line)}
.pk img{width:30px;height:30px;border-radius:50%;flex:none}
.pk b{display:block;font:700 14.5px Barlow}
.pk small{display:block;font:500 12px Barlow;color:var(--mut)}
.gr{flex:none;width:40px;text-align:center;border-radius:8px;color:#fff;font:800 italic 17px/1 'Barlow Condensed';padding:4px 0 3px}
.gr i{display:block;font:800 8.5px 'Barlow Condensed';font-style:normal;letter-spacing:.6px}
.gr.g1{background:#16a34a}.gr.g2{background:#ea580c}.gr.g3{background:#9a5a2b}
/* scheda squadra */
.th{display:flex;align-items:center;gap:14px;padding:16px}
.th img{width:84px;height:84px;border-radius:50%}
.th h2{margin:0;font:800 italic 28px/1 'Barlow Condensed'}
.th p{margin:4px 0 0;font:600 14px Barlow;color:var(--mut)}
.back{border:0;background:var(--c2);border-radius:10px;font:800 italic 15px 'Barlow Condensed';color:var(--acc);padding:7px 12px;margin-bottom:10px;cursor:pointer}
@media (min-width:600px){.hgrid{grid-template-columns:72px minmax(0,1fr) 72px}.tile{width:72px;height:72px}}

/* ===== (5) MODALITÀ NOTTE come Dreamers: viola/blu scuro con stelline; si accende con l interruttore luna in alto (e16_notte) ===== */
.top .sw{margin-left:auto;width:62px;height:34px;border-radius:20px;border:0;background:#fde7d3;position:relative;cursor:pointer;box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.top .sw i{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px;font-style:normal;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
html.notte .top .sw{background:linear-gradient(90deg,#6d28d9,#3730a3)}html.notte .top .sw i{left:31px;background:#1e1b4b}
.upd{display:none}
.foot{text-align:center;font:800 italic 13px 'Barlow Condensed';letter-spacing:1.5px;color:#fff;padding:24px 0 10px;opacity:.9}
nav{padding:0 6px}nav button{transform:skew(-10deg);border-radius:6px 6px 0 0}

/* ===== PUNTI FANTASY (AVG), regola della lega. Riga del tabellino (vedi tools/espn.mjs):
   [nome, squadra NBA, titolare, MIN, PTS, FGM, FGA, 3PM, 3PA, FTM, FTA, OREB, DREB, AST, STL, BLK, TO, PF, TF, FF, idESPN]

   Esempio del regolamento: 20 pt, 7/14, 2 triple, 4/5 tl, 2+5 rimbalzi, 4 ast, 1 rec, 1 stop, 3 perse, 2 falli = 44 */
function ffps(r){return r[4]+2*r[5]-r[6]+r[7]+r[9]-r[10]+2.5*r[11]+2*r[12]+2*r[13]+4*r[14]+4*r[15]-2*r[16]-r[17]-r[18]-3*r[19]}
const f1=v=>(Math.round(v*10)/10).toLocaleString("it-IT",{minimumFractionDigits:1,maximumFractionDigits:1});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function saveSt(){try{localStorage.setItem("e16_st",JSON.stringify(stQ))}catch(e){}}

/* ===== DATI: notti e righe ===== */
const nights=()=>typeof ESPN==="undefined"?[]:Object.keys(ESPN.days).filter(d=>ESPN.days[d].some(id=>ESPN.box[id])).sort();
function rowsOf(d){const out=[];for(const id of (ESPN.days[d]||[])){const g=ESPN.games[id],B=ESPN.box[id];if(!B)continue;for(const r of B){const opp=r[1]===g[0]?g[1]:g[0];out.push({r,g,opp,id,f:ffps(r)})}}return out}
const dIt=d=>{const[y,m,g]=d.split("-");return g+"/"+m};

/* ===== HOME ===== */
function vHome(){
 const N=nights(),d=night&&N.includes(night)?night:N[N.length-1];const i=N.indexOf(d);
 const tile=t=>`<button class="tile" data-team="${t.id}" aria-label="${esc(t.nome)}"><img src="${t.logo}" alt=""></button>`;
 let rows=d?rowsOf(d):[];const q=hq.trim().toLowerCase();if(q)rows=rows.filter(x=>x.r[0].toLowerCase().includes(q));
 rows.sort((a,b)=>b.f-a.f);
 const box=x=>{const r=x.r,miss=(r[6]-r[5])+(r[10]-r[9]);return`<div class="bx"><span>${r[4]}<i>PT</i></span><span>${r[11]+r[12]}<i>RB</i></span><span>${r[13]}<i>AS</i></span><span>${r[14]}<i>ST</i></span><span>${r[15]}<i>BL</i></span><span>${r[7]}<i>3P</i></span><span class="${r[16]>=4?"r":""}">${r[16]}<i>TO</i></span><span>${r[17]}<i>PF</i></span><span class="${miss>=10?"r":""}">${miss}<i>ERR</i></span>${r[18]||r[19]?`<span class="r">${r[18]?r[18]+"T":""}${r[19]?" "+r[19]+"F":""}<i>TEC/FLA</i></span>`:""}</div>`};
 const st=x=>x.g[4]==="L"?`<b style="color:var(--loss)">LIVE</b>`:"Finale";
 const list=rows.slice(0,q?60:40).map(x=>`<div class="pr" data-pl="${esc(x.r[0])}" style="cursor:pointer"><div class="prn"><b>${esc(x.r[0])}</b><span class="fb">${f1(x.f)}</span></div><div class="prs">${x.r[1]} vs ${x.opp} · ${st(x)} · ${x.r[3]} min</div>${box(x)}</div>`).join("")||`<div class="empty">${q?"Nessun giocatore":"Nessuna partita"}</div>`;
 return `<label class="srch"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="#9a5a2b" stroke-width="2.4"/><path d="M20 20l-4-4" stroke="#9a5a2b" stroke-width="2.4" stroke-linecap="round"/></svg><input id="hq" type="search" placeholder="Cerca giocatore" value="${esc(hq)}" autocomplete="off"></label>
 <div class="hgrid">
  <div class="hcol"><div class="hconf e">EAST</div>${TEAMS.filter(t=>t.conf==="E").map(tile).join("")}</div>
  <div class="card night">
   <div class="nhd"><button ${i>0?`data-night="${N[i-1]}"`:"disabled"} aria-label="Notte precedente">‹</button><span>NOTTE DEL ${d?dIt(d):"—"}</span><button ${i>=0&&i<N.length-1?`data-night="${N[i+1]}"`:"disabled"} aria-label="Notte successiva">›</button></div>
   <div class="nsub"><span>TUTTI I GIOCATORI</span><span>${rows.length} GIOCATORI · AVG</span></div>
   ${list}
  </div>
  <div class="hcol"><div class="hconf w">WEST</div>${TEAMS.filter(t=>t.conf==="W").map(tile).join("")}</div>
 </div>`;
}

/* ===== SCHEDA SQUADRA ===== */
/* media AVG di stagione e ultima partita di ogni giocatore (dai tabellini ESPN) */
let PST=null;function pstats(){if(PST)return PST;PST={};for(const d of nights())for(const x of rowsOf(d)){const p=PST[x.r[0]]||(PST[x.r[0]]={gp:0,ff:0,min:0,last:null});p.gp++;p.ff+=x.f;p.min+=x.r[3];p.last={d,f:x.f,opp:x.opp}}return PST}
function vTeam(id){const t=TM[id];if(!t)return"";const R0=ROSE[id]||[],P=pstats(),r=REC[id];
 const row=g=>{const p=P[g[0]];return`<tr data-pl="${esc(g[0])}" style="cursor:pointer"><td><div class="pl"><span style="display:inline-block;min-width:34px;font:800 11px 'Barlow Condensed';color:var(--mut)">${g[2]}</span>${esc(g[0])}<small>${g[1]} · ${g[3]}</small></div></td><td class="f">${p?f1(p.ff/p.gp):"–"}</td><td>${p?p.gp:0}</td><td>${p?f1(p.min/p.gp):"–"}</td><td>${p&&p.last?f1(p.last.f)+" <small style='color:var(--mut)'>"+dIt(p.last.d)+"</small>":"–"}</td></tr>`};
 const tit=R0.filter(g=>g[2]!=="BE"&&g[2]!=="IR"),be=R0.filter(g=>g[2]==="BE"||g[2]==="IR");
 const head=`<button class="back" data-back>‹ Indietro</button><div class="card"><div class="th"><img src="${t.logo}" alt=""><div><h2>${esc(t.nome)}</h2><p>${esc(t.gm)} · ${t.conf==="E"?"East":"West"}${r?` · ${r.w}-${r.l}`:""}</p></div></div>
 <div class="seg" style="padding:0 12px">${[["rosa","ROSA"],["cap","SALARY CAP"],["pick","SCELTE"]].map(([k,l])=>`<button class="${tmTab===k?"on":""}" data-tmtab="${k}">${l}</button>`).join("")}</div>`;
 if(tmTab==="cap")return head+capHtml(id)+`</div>`;
 if(tmTab==="pick")return head+pickHtml(id)+`</div>`;
 return head+`${R0.length?`<div class="tw"><table><tr><th>TITOLARI</th><th>AVG/G</th><th>G</th><th>MIN</th><th>ULTIMA</th></tr>${tit.map(row).join("")}<tr><th>PANCHINA</th><th></th><th></th><th></th><th></th></tr>${be.map(row).join("")}</table></div><div class="note">Rosa dallo screenshot ESPN. Media AVG di stagione ricalcolata dai tabellini.</div>`:`<div class="note">Rosa non ancora inserita.</div>`}</div>`}
/* ===== SALARY CAP e SCELTE (dati in cap-data.js, dal file della lega) ===== */
const YL=["26/27","27/28","28/29","29/30","30/31"];
const c1=v=>v==null?"":(Math.round(v*10)/10).toLocaleString("it-IT",{maximumFractionDigits:1});
function capHtml(id){const C=CAP[id];if(!C)return`<div class="note">Contratti non disponibili.</div>`;
 const occ=C.occ[0]||0,tg=C.tagli||0,lib=C.libero!=null?C.libero:CAP_TOT-occ-tg,pc=x=>Math.max(0,Math.min(100,x/CAP_TOT*100));
 const L=C.pl.slice().sort((a,b)=>(b[1][0]||0)-(a[1][0]||0));
 const scad=p=>p[1].length;/* anni di contratto rimasti */
 return `<div class="capbox"><div class="capn"><div><b>${c1(lib)}</b><span>LIBERO</span></div><div><b>${c1(occ)}</b><span>OCCUPATO</span></div><div><b>${c1(tg)}</b><span>TAGLI</span></div><div><b>${CAP_TOT}</b><span>CAP</span></div></div>
 <div class="capbar"><i style="width:${pc(occ)}%;background:var(--acc)"></i><i style="width:${pc(tg)}%;background:#9ca3af"></i><i style="width:${pc(lib)}%;background:var(--win)"></i></div>
 <div class="capleg"><span><i style="background:var(--acc)"></i>Occupato</span><span><i style="background:#9ca3af"></i>Tagli</span><span><i style="background:var(--win)"></i>Libero</span></div></div>
 <div class="tw"><table class="ct"><tr><th>GIOCATORE</th>${YL.map(y=>`<th>${y}</th>`).join("")}</tr>
 ${L.map(p=>`<tr><td><div class="pl">${esc(p[0])}${p[2]?` <span class="rk">R</span>`:""}<small>${scad(p)===1?"scade a fine stagione":scad(p)+" anni"}</small></div></td>${YL.map((y,i)=>`<td class="${p[1][i]!=null?"":"e"}">${p[1][i]!=null?c1(p[1][i]):"–"}</td>`).join("")}</tr>`).join("")}
 <tr class="tot"><td>TOTALE OCCUPATO</td>${YL.map((y,i)=>`<td>${c1(C.occ[i]||0)}</td>`).join("")}</tr>
 <tr class="tot"><td>LIBERO (su ${CAP_TOT})</td>${YL.map((y,i)=>`<td style="color:var(--win)">${c1(CAP_TOT-(C.occ[i]||0)-(i?0:tg))}</td>`).join("")}</tr></table></div>
 <div class="note">Cifre in milioni di crediti, dal file della lega. <span class="rk">R</span> = contratto da rookie. Gli anni futuri non contano tagli e nuovi contratti.</div>`}
function pickHtml(id){const C=CAP[id];if(!C)return`<div class="note">Scelte non disponibili.</div>`;
 const Y=[2027,2028,2029,2030,2031];
 return Y.map(y=>{const P=C.pk.filter(p=>p[0]===y);
  return `<div class="pky"><div class="pkyh">DRAFT ${y}<span>${P.length} scelt${P.length===1?"a":"e"}</span></div>${P.length?P.map(p=>{const o=TM[p[2]],own=p[2]===id;
   return `<div class="pk"><span class="gr g${p[1]}">${p[1]}°<i>GIRO</i></span><img src="${o?o.logo:""}" alt=""><div><b>${own?"Propria":"Da "+esc(o?o.nome:p[2])}</b>${p[3]?`<small>${esc(p[3].toLowerCase().replace(/^./,c=>c.toUpperCase()))}</small>`:""}</div></div>`}).join(""):`<div class="note" style="padding:6px 2px">Nessuna scelta</div>`}</div>`}).join("")+
 `<div class="note">Dal file della lega. Le scelte cedute ad altre squadre non compaiono.</div>`}
function vCapAll(){
 const row=t=>{const C=CAP[t.id]||{occ:[0],tagli:0,libero:0,pk:[]},lib=C.libero,n1=C.pk.filter(p=>p[1]===1).length,n=C.pk.length;
  return `<tr data-team="${t.id}" data-tab="cap"><td><div class="tm"><img src="${t.logo}" alt=""><span>${esc(t.nome)}<small>${esc(t.gm)}</small></span></div></td><td style="color:var(--win);font-weight:800">${c1(lib)}</td><td>${c1(C.occ[0])}</td><td>${c1(C.occ[1])}</td><td>${n1}<small style="color:var(--mut)"> / ${n}</small></td></tr>`};
 return ["E","W"].map(c=>{const L=TEAMS.filter(t=>t.conf===c).slice().sort((a,b)=>(CAP[b.id]?.libero||0)-(CAP[a.id]?.libero||0));
  return `<div class="card" style="margin-bottom:12px"><div class="ttl"><span class="dot" style="background:${c==="E"?"var(--east)":"var(--west)"}"></span>${c==="E"?"EAST":"WEST"} · SALARY CAP</div>
  <div class="tw"><table class="ct"><tr><th>SQUADRA</th><th>LIBERO</th><th>OCC. 26/27</th><th>OCC. 27/28</th><th>1° GIRO / SCELTE</th></tr>${L.map(row).join("")}</table></div></div>`}).join("")+
  `<div class="note" style="color:#fff">Cap ${CAP_TOT} per squadra. Tocca una squadra per vedere contratti e scelte.</div>`}

/* ===== LEGA: classifica, scontri diretti, playoff ===== */
function standings(conf){return TEAMS.filter(t=>t.conf===conf).map((t,i)=>{const r=REC[t.id]||{w:0,l:0,pf:0,pa:0};return{...t,...r,ord:i}}).sort((a,b)=>(b.w-a.w)||(a.l-b.l)||(b.pf-a.pf)||(a.ord-b.ord))}
function vLega(){
 const seg=`<div class="seg">${[["cls","CLASSIFICA"],["sfide","SCONTRI DIRETTI"],["po","PLAYOFF"]].map(([k,l])=>`<button class="${lgTab===k?"on":""}" data-lg="${k}">${l}</button>`).join("")}</div>`;
 const tm=t=>`<div class="tm" data-team="${t.id}"><img src="${t.logo}" alt=""><span>${esc(t.nome)}<small>${esc(t.gm)}</small></span></div>`;
 if(lgTab==="sfide")return seg+`<div class="card"><div class="ttl">SCONTRI DIRETTI</div><div class="note">Il calendario delle sfide arriverà dal collegamento con la lega ESPN.</div></div>`;
 if(lgTab==="po"){/* (provvisorio) regole Dreamers applicate per conference: 1ª–4ª tabellone per il titolo, 5ª–8ª l'altro tabellone (1-4 e 2-3) */
  const br=(L,a,lab)=>`<div class="ttl" style="font-size:16px">${lab}</div><div class="br">${[[0,3],[1,2]].map(([x,y])=>`<div class="brm"><div><em>${a+x+1}</em><img src="${L[a+x].logo}" alt="">${esc(L[a+x].nome)}</div><div><em>${a+y+1}</em><img src="${L[a+y].logo}" alt="">${esc(L[a+y].nome)}</div></div>`).join("")}</div>`;
  return seg+["E","W"].map(c=>{const L=standings(c);return`<div class="card" style="margin-bottom:12px"><div class="ttl"><span class="dot" style="background:${c==="E"?"var(--east)":"var(--west)"}"></span>${c==="E"?"EAST":"WEST"}</div>${br(L,0,"Tabellone titolo (1ª–4ª)")}${br(L,4,"Altro tabellone (5ª–8ª)")}</div>`}).join("")+`<div class="note" style="color:#fff">Provvisorio: regole playoff Dreamers per ogni conference, in attesa delle regole della lega.</div>`}
 return seg+["E","W"].map(c=>{const L=standings(c);return`<div class="card" style="margin-bottom:12px"><div class="ttl"><span class="dot" style="background:${c==="E"?"var(--east)":"var(--west)"}"></span>${c==="E"?"EASTERN CONFERENCE":"WESTERN CONFERENCE"}</div>
  <table><tr><th>SQUADRA</th><th>V</th><th>P</th><th>PF</th><th>PS</th></tr>${L.map((t,i)=>`<tr class="${i<4?"po":"po2"}"><td>${tm(t)}</td><td>${t.w}</td><td>${t.l}</td><td>${f1(t.pf)}</td><td>${f1(t.pa)}</td></tr>`).join("")}</table>
  <div class="note">Verde: 1ª–4ª (tabellone titolo) · arancio: 5ª–8ª. Vittorie e punti arriveranno dalla lega ESPN.</div></div>`}).join("");
}

/* (4) la vecchia pagina Statistiche è sostituita da stats.js (Giocatori, Squadre, profili con grafici, comparatore) */
render();
</script>
<script src="stats.js"></script>
<script>render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
