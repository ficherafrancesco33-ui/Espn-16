<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e7590c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ESPN 16</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="fonts.css">
<!-- (100) i due fogli giorno/notte si scaricano subito e con priorità alta, così il cambio non trova mai la pagina senza stile -->
<link rel="preload" href="skin-giorno.css" as="style"><link rel="preload" href="skin-notte.css" as="style">
<link rel="stylesheet" href="skin-giorno.css" id="skg" media="not all">
<link rel="stylesheet" href="skin-notte.css" id="skn">
<style>/* ===== ESPN 16 – app del Fantabasket Dynasty a 16 squadre (base grafica: app Dreamers) =====
   Colori in variabili: tema arancio come la Home Dreamers. */:root{--c2:#fdf3e1;--c3:#fff7ed;--cb:#f3c48d;--c4:#fbe9cc;--hd1:#f97316;--hd2:#ea580c;--hd3:#c2410c;--bg1:#b8763f;--bg2:#a8652f;--card:var(--c2);--card2:var(--c4);--line:#eed2a6;--ink:#3b1d0a;--mut:#9a5a2b;--acc:#ea580c;--ffp:#7c3aed;--win:#16a34a;--loss:#dc2626;--east:#2563eb;--west:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
.e16 .card{background:var(--card);border-radius:18px;box-shadow:0 4px 0 rgba(0,0,0,.12),0 8px 20px rgba(0,0,0,.12)}
/* HOME: 8 squadre East a sinistra, 8 West a destra, finestra della notte al centro (più stretta che in Dreamers) */.e16 .hgrid{display:grid;grid-template-columns:56px minmax(0,1fr) 56px;gap:8px;align-items:start}
.e16 .hcol{display:flex;flex-direction:column;gap:7px}
.e16 .hconf{font:800 italic 12px 'Barlow Condensed';color:#fff;text-align:center;letter-spacing:1px;padding:3px 0;border-radius:6px}
.e16 .hconf.e{background:var(--east)}
.e16 .hconf.w{background:var(--west)}
.e16 .tile{display:block;width:56px;height:56px;border-radius:14px;border:0;padding:3px;cursor:pointer;background:linear-gradient(160deg,var(--c3),#fed7aa);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.e16 .tile img{width:100%;height:100%;object-fit:contain;display:block}
.e16 .night{padding:12px 10px 6px}
.e16 .nhd{display:flex;align-items:center;justify-content:space-between;font:800 italic 18px 'Barlow Condensed';color:var(--acc);letter-spacing:1.5px}
.e16 .nhd button{border:0;background:none;font:800 22px 'Barlow Condensed';color:var(--acc);padding:2px 8px;cursor:pointer}
.e16 .nsub{display:flex;justify-content:space-between;font:800 italic 12.5px 'Barlow Condensed';color:var(--mut);letter-spacing:.8px;border-bottom:2px solid var(--line);padding:8px 2px 6px;margin-bottom:4px}
.e16 .pr{padding:9px 2px;border-bottom:1px solid var(--line)}
.e16 .prn{display:flex;align-items:center;gap:7px}
.e16 .prn b{font:600 17px Barlow;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e16 .fb{flex:none;font:800 italic 14px 'Barlow Condensed';color:#fff;background:var(--ffp);border-radius:7px;padding:2px 7px}
.e16 .prs{font:500 13px Barlow;color:var(--mut);margin:2px 0 6px}
.e16 .bx{display:flex;flex-wrap:wrap;gap:4px}
.e16 .bx span{min-width:34px;text-align:center;border:1.5px solid var(--cb);border-radius:8px;background:var(--c3);padding:2px 3px 1px;font:800 16px/1 'Barlow Condensed'}
.e16 .bx span i{display:block;font:700 9px 'Barlow Condensed';color:var(--mut);font-style:normal;margin-top:2px}
.e16 .bx span.g{color:var(--win)}
.e16 .bx span.r{color:var(--loss)}
.e16 .empty{padding:22px 8px;text-align:center;color:var(--mut);font:600 14px Barlow}
.e16 .srch{display:flex;align-items:center;gap:8px;background:var(--c2);border:2px solid var(--cb);border-radius:30px;padding:9px 14px;margin-bottom:12px}
.e16 .srch input{border:0;background:none;font:500 17px Barlow;color:var(--ink);outline:none;width:100%}
/* LEGA */.e16 .seg{display:flex;gap:6px;margin-bottom:12px}
.e16 .seg button{flex:1;border:0;border-radius:10px;padding:9px 4px;font:800 italic 16px 'Barlow Condensed';letter-spacing:.6px;background:var(--c2);color:var(--mut);cursor:pointer}
.e16 .seg button.on{background:var(--acc);color:#fff}
.e16 .ttl{font:800 italic 20px 'Barlow Condensed';letter-spacing:1px;padding:12px 14px 6px;display:flex;align-items:center;gap:8px}
.e16 .ttl .dot{width:10px;height:10px;border-radius:50%}
.e16 table{width:100%;border-collapse:collapse}
.e16 th{font:800 11.5px 'Barlow Condensed';color:var(--mut);letter-spacing:.6px;text-align:right;padding:6px 6px;border-bottom:2px solid var(--line);white-space:nowrap}
.e16 th:first-child,.e16 td:first-child{text-align:left}
.e16 td{font:600 14px Barlow;padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.e16 .tm{display:flex;align-items:center;gap:8px;min-width:0}
.e16 .tm img{width:30px;height:30px;object-fit:contain;flex:none}
.e16 .tm span{overflow:hidden;text-overflow:ellipsis}
.e16 .tm small{display:block;font:500 11.5px Barlow;color:var(--mut)}
.e16 .po td{background:rgba(22,163,74,.07)}
.e16 .po2 td{background:rgba(234,88,12,.06)}
.e16 .note{font:500 12.5px Barlow;color:var(--mut);padding:8px 14px 12px}
.e16 .mt{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.e16 .mt .tm:last-child{flex-direction:row-reverse;text-align:right}
.e16 .mt .vs{font:800 italic 14px 'Barlow Condensed';color:var(--mut)}
.e16 .br{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 12px 14px}
.e16 .brm{border:2px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--c3)}
.e16 .brm div{display:flex;align-items:center;gap:6px;font:700 13px Barlow;padding:3px 0}
.e16 .brm img{width:22px;height:22px;object-fit:contain}
.e16 .brm em{font:800 italic 12px 'Barlow Condensed';color:var(--mut);font-style:normal;width:16px}
/* STATISTICHE */.e16 .flt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.e16 .flt select{border:2px solid var(--cb);border-radius:10px;background:var(--c2);font:700 14px Barlow;color:var(--ink);padding:7px 8px}
.e16 .tw{overflow-x:auto}
.e16 .tw th{cursor:pointer;position:sticky;top:0;background:var(--card)}
.e16 .tw th.on{color:var(--acc)}
.e16 .tw td.f{font:800 italic 16px 'Barlow Condensed';color:var(--ffp)}
.e16 .e16pl{font:600 14px Barlow;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.e16 .e16pl small{display:block;font:500 11px Barlow;color:var(--mut)}
.e16 .rules{padding:4px 14px 12px;font:500 13px Barlow;color:var(--mut)}
.e16 .rules b{color:var(--ink)}
/* statistiche (stats.js) */.e16 .hub{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.e16 .hubb{display:flex;align-items:center;gap:14px;border:0;border-radius:18px;padding:16px 18px;color:#fff;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.e16 .hubb span{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;font-size:20px}
.e16 .hubb b{font:800 italic 28px 'Barlow Condensed';letter-spacing:1px;flex:1;text-align:left}
.e16 .hubb i{font:800 22px Barlow;font-style:normal;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center}
.e16 .hubb.b1{background:linear-gradient(90deg,#1e2a5a,#2b3d84)}
.e16 .hubb.b2{background:linear-gradient(90deg,#ea580c,#f97316)}
.e16 .hubb.b3{background:linear-gradient(90deg,#166534,#16a34a)}
.e16 .bk,.e16 .bk2{border:0;background:none;font:800 italic 16px 'Barlow Condensed';color:#fff;letter-spacing:1px;padding:4px 0 10px;cursor:pointer}
.e16 .bk2{border:2px solid #fff;border-radius:20px;padding:6px 14px;margin-bottom:12px}
.e16 .sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.e16 .sh span{background:var(--acc);color:#fff;font:800 italic 22px 'Barlow Condensed';padding:4px 14px;transform:skew(-8deg)}
.e16 .sh em{font:800 italic 14px 'Barlow Condensed';color:#fff;letter-spacing:1px}
.e16 .srch2{display:flex;gap:8px;align-items:center;background:var(--c2);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.e16 .srch2 input{border:0;background:none;font:500 16px Barlow;width:100%;outline:none;color:var(--ink)}
.e16 .slab{font:800 12px 'Barlow Condensed';color:#fff;letter-spacing:1.2px;margin:8px 0 4px}
.e16 .cmpc .slab{color:var(--mut)}
.e16 .per label{display:flex;align-items:center;gap:6px;background:var(--c2);border-radius:14px;padding:8px 12px;font:800 italic 15px 'Barlow Condensed';color:var(--acc)}
.e16 .per input{border:0;background:none;font:800 italic 15px 'Barlow Condensed';color:var(--acc);min-width:0;flex:1}
.e16 .chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.e16 .chips::-webkit-scrollbar{display:none}
.e16 .chips button{flex:none;border:2px solid var(--cb);background:var(--c2);border-radius:8px;font:800 italic 13px 'Barlow Condensed';letter-spacing:.8px;color:var(--acc);padding:6px 10px;cursor:pointer}
.e16 .chips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.e16 .tg{display:flex;gap:4px;margin:4px 0 8px}
.e16 .tg button{border:0;background:var(--c2);color:var(--acc);font:800 italic 13px 'Barlow Condensed';padding:6px 14px;transform:skew(-10deg);cursor:pointer}
.e16 .tg button.on{background:var(--acc);color:#fff}
.e16 .gt{overflow-x:auto;background:var(--card);border-radius:16px}
.e16 .gt th{background:var(--acc);color:#fff;font:800 italic 12px 'Barlow Condensed';padding:9px 6px;text-align:right;cursor:pointer}
.e16 .gt th.on{color:#fde68a}
.e16 .gt td{padding:9px 6px;font:700 15px 'Barlow Condensed'}
.e16 .gt td.rn{color:var(--acc);font:800 italic 16px 'Barlow Condensed'}
.e16 .gt tr[data-pl]{cursor:pointer}
.e16 .gn b{display:flex;align-items:center;gap:6px;font:800 italic 17px 'Barlow Condensed';color:var(--acc);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.e16 .gn small{display:flex;align-items:center;gap:4px;font:600 11.5px Barlow;color:var(--mut);white-space:nowrap}
.e16 .gn small img{width:16px;height:16px;object-fit:contain}
.e16 .rb{display:inline-block;width:4px;height:15px;border-radius:2px;transform:skew(-12deg);background:#9ca3af}
.e16 .rb.G{background:#f87171}
.e16 .rb.A{background:#fbbf24}
.e16 .rb.C{background:#60a5fa}
.e16 .ffb{display:inline-block;min-width:46px;text-align:center;border-radius:8px;color:#fff;font:800 italic 15px/1 'Barlow Condensed';padding:5px 6px}
.e16 .ffb.v,.e16 .cl.v,.e16 .lg.v{background:#7c3aed}
.e16 .ffb.g,.e16 .cl.g,.e16 .lg.g{background:#16a34a}
.e16 .ffb.o,.e16 .cl.o,.e16 .lg.o{background:#ea8a0c}
.e16 .ffb.r,.e16 .cl.r,.e16 .lg.r{background:#dc2626}
.e16 .ef{white-space:nowrap}
.e16 .dt{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.e16 .dt.g{background:#16a34a}
.e16 .dt.o{background:#ea8a0c}
.e16 .dt.r{background:#dc2626}
.e16 .bxm{display:flex;gap:3px;margin-top:4px}
.e16 .bxm span{min-width:30px;text-align:center;border:1.5px solid var(--cb);border-radius:6px;background:var(--c3);font:800 12px/1 'Barlow Condensed';padding:2px}
.e16 .bxm i{display:block;font:700 7.5px 'Barlow Condensed';color:var(--mut);font-style:normal}
.e16 .tchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.e16 .tchips::-webkit-scrollbar{display:none}
.e16 .tchips button{flex:none;display:flex;align-items:center;gap:6px;border:2px solid var(--cb);background:var(--c2);border-radius:10px;padding:5px 10px 5px 5px;font:800 italic 14px 'Barlow Condensed';color:var(--acc);cursor:pointer}
.e16 .tchips button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.e16 .tchips img{width:28px;height:28px;object-fit:contain}
.e16 .tban{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#1e2a5a,#2b4aa8);border-radius:16px;padding:16px;color:#fff;margin-bottom:10px}
.e16 .tban img{width:70px;height:70px;object-fit:contain}
.e16 .tban small{font:800 11px 'Barlow Condensed';letter-spacing:1.5px;opacity:.85}
.e16 .tban b{display:block;font:800 italic 30px/1 'Barlow Condensed'}
.e16 .kp{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--cb);border-radius:14px;overflow:hidden;margin-bottom:8px}
.e16 .kp.k3{grid-template-columns:1fr 1fr 1fr}
.e16 .kp div{background:var(--card);padding:10px 12px}
.e16 .kp small{font:800 11px 'Barlow Condensed';color:var(--mut);letter-spacing:1px}
.e16 .kp b{display:block;font:800 italic 28px/1.1 'Barlow Condensed';color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e16 .kp span{font:500 11.5px Barlow;color:var(--mut)}
.e16 .cmpb{width:100%;border:2px solid var(--cb);background:var(--c3);border-radius:12px;padding:11px;font:800 italic 16px 'Barlow Condensed';letter-spacing:1px;color:var(--acc);margin:6px 0 10px;cursor:pointer}
.e16 .mt2{overflow-x:auto;background:var(--card);border-radius:16px}
.e16 .mt2 th{background:var(--acc);color:#fff;font:800 italic 12px 'Barlow Condensed';padding:8px 5px;text-align:center}
.e16 .mt2 th:first-child{text-align:left}
.e16 .mt2 td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}
.e16 .mt2 td:first-child{text-align:left;cursor:pointer;min-width:140px}
.e16 .cl{display:inline-block;min-width:40px;border-radius:8px;color:#fff;font:800 italic 14px/1 'Barlow Condensed';padding:5px 3px 2px}
.e16 .cl i{display:block;font:700 8px 'Barlow Condensed';font-style:normal;opacity:.9;margin-top:2px}
.e16 .lg{display:inline-block;color:#fff;font:800 italic 11px 'Barlow Condensed';padding:2px 6px;border-radius:6px}
.e16 .pbg{background:linear-gradient(180deg,#1e3a8a,#1e40af);border-radius:18px;padding:14px;margin:-4px -2px 0}
.e16 .ph{display:flex;align-items:center;gap:12px;color:#fff;margin-bottom:6px}
.e16 .ph img{width:62px;height:62px;object-fit:contain}
.e16 .ph small{font:800 11px 'Barlow Condensed';letter-spacing:1.5px;opacity:.85}
.e16 .ph b{display:block;font:800 italic 28px/1 'Barlow Condensed'}
.e16 .psel{width:100%;border:2px solid #fff;border-radius:12px;background:#1e3a8a;color:#fde68a;font:800 italic 16px 'Barlow Condensed';padding:9px}
.e16 .mp{display:flex;background:rgba(255,255,255,.12);border-radius:12px;padding:3px;gap:3px}
.e16 .mp button{flex:1;border:0;background:none;color:#fff;font:800 italic 15px 'Barlow Condensed';letter-spacing:1px;padding:8px;border-radius:9px;cursor:pointer}
.e16 .mp button.on{background:#0b1022}
.e16 .mp.lt{background:var(--c2)}
.e16 .mp.lt button{color:var(--mut)}
.e16 .mp.lt button.on{background:var(--acc);color:#fff}
.e16 .mt3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0}
.e16 .mt3 button{border:0;border-radius:12px;background:#93a8e6;color:#1e2a5a;padding:8px 4px;cursor:pointer}
.e16 .mt3 button.on{background:var(--acc);color:#fff}
.e16 .mt3 small{font:800 11px 'Barlow Condensed';letter-spacing:1px}
.e16 .mt3 b{display:block;font:800 italic 22px 'Barlow Condensed'}
.e16 .chw{background:#0b1022;border-radius:16px;padding:10px 8px 8px;margin-top:6px}
.e16 .chh{display:flex;justify-content:flex-end;gap:14px;font:800 14px 'Barlow Condensed';color:#e5e7eb;padding:0 6px}
.e16 .chh .up{color:#4ade80}
.e16 .chh .dn{color:#f87171}
.e16 .chs{width:100%;height:auto;display:block}
.e16 .chn{font:500 12px Barlow;color:#9aa3c4;padding:2px 6px}
.e16 .glog td,.e16 .glog th{text-align:center!important;font-size:13.5px}
.e16 .cmpc{padding:14px}
.e16 .cmpc h3{margin:2px 0 10px;font:800 italic 28px 'Barlow Condensed';color:var(--acc)}
.e16 .up2{font:800 11px 'Barlow Condensed';color:var(--mut);letter-spacing:1.2px}
.e16 .csel{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--cb);border-radius:14px;padding:4px 10px;margin-bottom:8px}
.e16 .csel i{width:10px;height:10px;border-radius:50%;flex:none}
.e16 .csel select{border:0;background:none;font:800 italic 15px 'Barlow Condensed';color:var(--acc);width:100%;padding:6px 0}
.e16 .cmpe{background:#fff;border-radius:14px;padding:30px 10px;text-align:center;color:var(--acc);font:500 15px Barlow;margin-top:10px}
/* (6) Statistiche: date del periodo e logo squadra al posto della maglia nel grafico */.e16dt{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.e16dt label{display:flex;align-items:center;gap:6px;font:700 13px Barlow;color:var(--fg)}
.e16dt input{border:1px solid var(--line);border-radius:10px;padding:6px 8px;font:700 14px Barlow;background:var(--panel);color:var(--fg)}
.grjs.e16js{display:grid;place-items:center}
.grjs.e16js img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(0,0,0,.45))}
.snrow[data-pl],.farow,.plink{cursor:pointer}
/* (18) banner squadra: logo grande come quello dei Ducks in Dreamers, per tutte le squadre */
.teamhead .hlogo{width:80px!important;height:80px!important;margin:-8px -4px -8px -6px!important;object-fit:contain!important;border-radius:0!important;box-shadow:none!important;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))!important}
/* (17) loghi dei binari Home con lo sfondo colore squadra come Dreamers (anche di notte) */
/* (25) notte: loghi della Home senza sfondo colorato, come Dreamers (sfondo del pannello) */
/* (15) campo: lista Titolari a colori pieni (la Tribuna resta sbiadita) */
.dptrib.e16tit .bpl{opacity:1!important;filter:none!important}
.bev .cev.v{background:#8b5cf6!important;color:#fff!important;-webkit-text-fill-color:#fff!important}
.bev .cev.y{background:#f5b400!important;color:#3b1d0a!important;-webkit-text-fill-color:#3b1d0a!important}
.bev .cev.g{background:#3ba764!important;color:#fff!important;-webkit-text-fill-color:#fff!important}
/* (12) grafico giocatore: nome nel menu ben leggibile */
.grroom .grsel select{color:#fff!important;-webkit-text-fill-color:#fff!important}
/* (10) campo: riquadro dei 9 titolari fuori dal campo a tutta larghezza */
.e16dp .dpg{display:grid;grid-template-columns:repeat(3,1fr)}
/* (9) scelte: previsione e valore */
.e16 .pk small.pkpr{font-weight:700}.e16 .pk small.pkpr.qa{color:#16a34a}.e16 .pk small.pkpr.qm{color:#b45309}.e16 .pk small.pkpr.qb{color:#dc2626}
.e16 .pkv{flex:none;text-align:right;font:800 italic 18px/1 'Barlow Condensed';color:var(--acc)}.e16 .pkv i{display:block;font:700 9px 'Barlow Condensed';font-style:normal;color:var(--mut);letter-spacing:.8px;text-transform:uppercase}
/* (23) playoff */
.e16po{display:grid;gap:8px;padding:6px 0}.e16po .bkm{position:relative}
/* (8) pagina Lega: logo sotto il tasto «Torna all app» */
.drroom .drhd{padding-top:30px}
/* (7) casella Home: scorrimento */
.hmtrk.anim{transition:transform .34s cubic-bezier(.22,.8,.3,1)}
.hmcl[data-team],.hmtm[data-team]{cursor:pointer}
/* (6) Home: due binari di loghi */.hn6.hn6two{grid-template-columns:52px minmax(0,1fr) 52px!important}
.hn6.hn6two>.hmqrow{grid-column:1/-1!important;grid-row:1!important}
.hn6.hn6two>.hmrail{grid-row:2!important;grid-column:1!important}
.hn6.hn6two>.hmrail.hmrailw{grid-column:3!important}
.hn6.hn6two>.hmmain{grid-row:2!important;grid-column:2!important;min-width:0}
.hmp.lvx{cursor:pointer}
/* salary cap e scelte */.e16 .capbox{margin:0 12px 10px;padding:12px;border-radius:14px;background:var(--c3);border:2px solid var(--line)}
.e16 .capn{display:grid;grid-template-columns:repeat(4,1fr);text-align:center}
.e16 .capn b{display:block;font:800 italic 26px/1 'Barlow Condensed'}
